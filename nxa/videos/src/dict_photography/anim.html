<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Manrope;font-weight:200;src:url(../fonts/manrope-latin-200-normal.woff2)}
@font-face{font-family:Manrope;font-weight:400;src:url(../fonts/manrope-latin-400-normal.woff2)}
:root{--bg:#F4F4F2;--ink:#111111;--acc:#D62271}
html,body{margin:0;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Manrope}
/* everything that matters sits in the 4:5 feed zone, y 285–1635 */
#word{position:absolute;left:100px;top:640px;font-weight:200;font-size:132px;letter-spacing:-3px;line-height:1;white-space:nowrap}
#pos{position:absolute;left:104px;top:800px;font-weight:400;font-size:30px;letter-spacing:.5px;opacity:0}
#def{position:absolute;left:100px;top:900px;width:860px;font-weight:400;font-size:44px;line-height:1.42}
#def span{opacity:0}
.strike{position:absolute;height:3px;background:var(--acc);transform-origin:left center;transform:scaleX(0)}
#line{position:absolute;left:100px;top:1160px;width:860px;font-weight:400;font-size:54px;line-height:1.35}
#line span{opacity:0;display:inline-block;transform:translateY(14px)}
#mark{position:absolute;left:868px;top:1478px;width:64px;opacity:0}
</style></head><body>
<div id="stage">
  <div id="word"></div>
  <div id="pos">/fəˈtɒɡrəfi/ &nbsp;·&nbsp; n.</div>
  <div id="def"></div>
  <div id="line"></div>
  <svg id="mark" viewBox="51.102 7.252 28.507 15.711"><path fill="#D62271" d="M63.649 11.851L60.679 13.919L51.102 7.252L57.043 7.252ZM51.102 22.963L73.668 7.252L79.609 7.252L57.043 22.963ZM67.062 18.364L70.033 16.296L79.609 22.963L73.668 22.963Z"/></svg>
</div>
<script>
const WORD="Photography";
const LINE="We capture how it feels, the way you'd describe it to a friend.";
let TM=null, TOTAL=14.0, STRIKE=[0,0], AVA=[0,0];
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const eout=t=>1-Math.pow(1-t,3), eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function setup(timings, avaDur){
  TM=timings;
  document.getElementById("def").innerHTML=TM.def.map(d=>`<span>${d[0]}</span>`).join(" ");
  document.getElementById("line").innerHTML=LINE.split(" ").map(w=>`<span>${w}</span>`).join(" ");
  // one strike bar per rendered line of the definition
  const def=document.getElementById("def"), stage=document.getElementById("stage"), sr=stage.getBoundingClientRect();
  const r=document.createRange(); r.selectNodeContents(def);
  const rows={}; for(const b of r.getClientRects()){const k=Math.round(b.top); rows[k]=rows[k]?{l:Math.min(rows[k].l,b.left),r:Math.max(rows[k].r,b.right),t:b.top,h:b.height}:{l:b.left,r:b.right,t:b.top,h:b.height};}
  Object.values(rows).sort((a,b)=>a.t-b.t).forEach(row=>{
    const s=document.createElement("div"); s.className="strike";
    s.style.left=(row.l-sr.left)+"px"; s.style.width=(row.r-row.l)+"px"; s.style.top=(row.t-sr.top+row.h*0.55)+"px";
    stage.appendChild(s);
  });
  const dEnd=TM.def[TM.def.length-1][2];
  STRIKE=[dEnd+0.30, dEnd+0.85];
  AVA=[STRIKE[1]+0.40, STRIKE[1]+0.40+avaDur];
  TOTAL=AVA[1]+1.9;
  return {STRIKE, AVA, TOTAL};
}

function render(t){
  // 1 · the word types on while the machine says it
  const [w0,w1]=TM.word, n=Math.round(WORD.length*seg(t,w0,w1));
  document.getElementById("word").textContent=WORD.slice(0,n);
  document.getElementById("pos").style.opacity=.7*eout(seg(t,TM.pos[0]-.1,TM.pos[0]+.25));
  // 2 · definition words appear as they are spoken
  const spans=document.querySelectorAll("#def span");
  TM.def.forEach((d,i)=>{ spans[i].style.opacity = (t>=d[1]-0.04 ? 1 : 0) * (1-.55*eio(seg(t,STRIKE[0],STRIKE[1]))); });
  // 3 · Rose strike, row after row
  const bars=document.querySelectorAll(".strike"), k=bars.length;
  bars.forEach((b,i)=>{ const a=STRIKE[0]+(STRIKE[1]-STRIKE[0])*i/k, z=STRIKE[0]+(STRIKE[1]-STRIKE[0])*(i+1)/k;
    b.style.transform=`scaleX(${eio(seg(t,a,z))})`; });
  // 4 · our line, word by word across Ava's take
  const ls=document.querySelectorAll("#line span"), per=(AVA[1]-AVA[0])/ls.length;
  ls.forEach((s,i)=>{ const p=eout(seg(t,AVA[0]+i*per,AVA[0]+i*per+.28)); s.style.opacity=p; s.style.transform=`translateY(${14*(1-p)}px)`; });
  // 5 · the × signs it off
  const m=seg(t,AVA[1]+.45,AVA[1]+.75); const mk=document.getElementById("mark");
  mk.style.opacity=m; mk.style.transform=`scale(${.6+.4*eout(m)})`;
}
window.setup=setup; window.render=render;
</script></body></html>
