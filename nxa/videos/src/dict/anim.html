<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Manrope;font-weight:200;src:url(../fonts/manrope-latin-200-normal.woff2)}
@font-face{font-family:Manrope;font-weight:400;src:url(../fonts/manrope-latin-400-normal.woff2)}
@font-face{font-family:Manrope;font-weight:700;src:url(../fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:Hand;src:url(../fonts/nothing-you-could-do-latin-400-normal.woff2)}
:root{--bg:#F4F4F2;--ink:#111111;--acc:#D62271}
html,body{margin:0;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Manrope}
/* everything sits inside the 4:5 feed zone, y 285–1635 */
#meter{position:absolute;left:104px;top:470px;height:84px;display:flex;align-items:center;gap:12px;opacity:0}
#meter i{display:block;width:2.5px;background:var(--ink);height:6px;border-radius:2px}
.blk{position:absolute;left:100px;width:880px;opacity:0;will-change:transform,opacity}
#word{top:600px;font-weight:200;font-size:132px;letter-spacing:-3px;line-height:1;white-space:nowrap}
#pos{top:762px;font-weight:400;font-size:30px;letter-spacing:.5px}
#def{top:860px;font-weight:400;font-size:44px;line-height:1.42}
.strike{position:absolute;height:3px;background:var(--acc);transform-origin:left center;transform:scaleX(0)}
#line{position:absolute;left:96px;top:1130px;width:900px;font-family:Hand;font-size:66px;line-height:1.3}
#line .row{display:block;white-space:nowrap;clip-path:inset(0 100% 0 0);visibility:hidden}
.sign{position:absolute;left:100px;font-family:Manrope;font-size:54px;letter-spacing:.14em;line-height:1;display:none}
#yes{top:330px;padding:22px 30px 20px 36px;background:#FFFFFF;color:#7D838D;font-weight:400;box-shadow:inset 0 0 0 1.5px #C9CDD4;opacity:0}
#but{width:880px;box-sizing:border-box;padding:0 36px;background:var(--acc);color:#F4F4F2;font-weight:700;align-items:center;clip-path:inset(0 100% 0 0)}
#mark{position:absolute;left:868px;top:1490px;width:64px;opacity:0}
</style></head><body>
<div id="stage">
  <div id="meter"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="word" class="blk"></div>
  <div id="pos" class="blk"></div>
  <div id="def" class="blk"></div>
  <div id="line"></div>
  <div id="yes" class="sign">YES,</div>
  <div id="but" class="sign"><span>BUT</span></div>
  <svg id="mark" viewBox="51.102 7.252 28.507 15.711"><path id="markp" d="M63.649 11.851L60.679 13.919L51.102 7.252L57.043 7.252ZM51.102 22.963L73.668 7.252L79.609 7.252L57.043 22.963ZM67.062 18.364L70.033 16.296L79.609 22.963L73.668 22.963Z"/></svg>
</div>
<script>
let TM=null, PLAN=null, ENV=[], ROWS=[];
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const eout=t=>1-Math.pow(1-t,3), eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function setup(entry, timings, plan, env){
  TM=timings; PLAN=plan; ENV=env||[];
  const r=document.documentElement.style;
  r.setProperty("--bg",entry.colors.bg); r.setProperty("--ink",entry.colors.ink); r.setProperty("--acc",entry.colors.acc);
  document.getElementById("markp").setAttribute("fill",entry.colors.acc);
  document.getElementById("word").textContent=entry.word;
  document.getElementById("pos").innerHTML=entry.phonetic;
  document.getElementById("def").textContent=entry.definition;
  const stage=document.getElementById("stage"), sr=stage.getBoundingClientRect();
  // strike bars, one per rendered row of the definition
  const def=document.getElementById("def"); def.style.opacity=1;
  const rg=document.createRange(); rg.selectNodeContents(def); const rows={};
  for(const b of rg.getClientRects()){const k=Math.round(b.top); rows[k]=rows[k]?{l:Math.min(rows[k].l,b.left),r:Math.max(rows[k].r,b.right),t:b.top,h:b.height}:{l:b.left,r:b.right,t:b.top,h:b.height};}
  Object.values(rows).sort((a,b)=>a.t-b.t).forEach(row=>{const s=document.createElement("div"); s.className="strike";
    s.style.left=(row.l-sr.left)+"px"; s.style.width=(row.r-row.l)+"px"; s.style.top=(row.t-sr.top+row.h*.56)+"px"; stage.appendChild(s);});
  def.style.opacity=0;
  // handwritten line in rows that fit
  const line=document.getElementById("line"), probe=document.createElement("span");
  probe.style.cssText="font-family:Hand;font-size:66px;white-space:nowrap;position:absolute;visibility:hidden"; stage.appendChild(probe);
  let cur=""; const out=[];
  for(const w of entry.line.split(" ")){ probe.textContent=(cur?cur+" ":"")+w; if(probe.offsetWidth>880 && cur){out.push(cur); cur=w;} else cur=probe.textContent; }
  if(cur) out.push(cur); probe.remove();
  line.innerHTML=out.map(t=>`<span class="row">${t}</span>`).join("");
  ROWS=[...line.querySelectorAll(".row")].map(el=>({el,w:el.scrollWidth}));
  // the word must fit: shrink very long words
  const wd=document.getElementById("word"); let fs=132; while(wd.scrollWidth>880 && fs>80){fs-=4; wd.style.fontSize=fs+"px";}
  // optional "Yes, but" variant: faint YES sign on top, BUT bar laid over the struck definition
  // modes: "cover" = BUT bar laid over the struck definition, YES fades when Ava starts
  //        "below" = struck definition stays, BUT bar sits under it, YES stays to the end
  YB=plan.yesbut||false;
  if(YB){ const y=document.getElementById("yes"), bt=document.getElementById("but"), df=def.getBoundingClientRect();
    y.style.display="block"; bt.style.display="flex";
    if(entry.yes){ if(entry.yes.bg) y.style.background=entry.yes.bg; if(entry.yes.color) y.style.color=entry.yes.color; y.style.boxShadow="none"; }
    if(YB==="below"){ const top=df.bottom-sr.top+22, h=96; bt.style.top=top+"px"; bt.style.height=h+"px";
      document.getElementById("line").style.top=(top+h+34)+"px"; }
    else { bt.style.top=(df.top-sr.top-14)+"px"; bt.style.height=(df.height+28)+"px"; } }
  return plan;
}
let YB=false;

function rise(id,t,at,dur=.6,y=26){const p=eout(seg(t,at,at+dur)), el=document.getElementById(id);
  el.style.opacity=p; el.style.transform=`translateY(${y*(1-p)}px)`; return el;}

function render(t){
  const STRIKE=PLAN.STRIKE, AVA=PLAN.AVA;
  // AI line meter, driven by the machine voice, gone before Ava speaks
  const mt=document.getElementById("meter"), f=Math.min(ENV.length-1, Math.round(t*30));
  mt.style.opacity = eout(seg(t,.15,.45)) * (1-eio(seg(t,TM.end+.1,TM.end+.5)));
  const order=[3,2,4,1,5,0,6];
  mt.querySelectorAll("i").forEach((el,i)=>{ const v=(ENV[f]&&f>=0)?ENV[f][order[i]]:0; el.style.height=(6+78*v)+"px"; });
  rise("word",t,TM.word[0]-.05,.7);
  rise("pos",t,TM.pos[0]-.05,.5,14).style.opacity*=.7;
  const def=rise("def",t,TM.def[0]-.05,.7);
  def.style.opacity = def.style.opacity*(1-.55*eio(seg(t,STRIKE[0],STRIKE[1])));
  const bars=document.querySelectorAll(".strike"), k=bars.length;
  bars.forEach((b,i)=>{const a=STRIKE[0]+(STRIKE[1]-STRIKE[0])*i/k, z=STRIKE[0]+(STRIKE[1]-STRIKE[0])*(i+1)/k; b.style.transform=`scaleX(${eio(seg(t,a,z))})`;});
  const total=ROWS.reduce((s,r)=>s+r.w,0); let acc=0;
  ROWS.forEach(r=>{const a=AVA[0]+(AVA[1]-AVA[0])*acc/total, z=AVA[0]+(AVA[1]-AVA[0])*(acc+r.w)/total; acc+=r.w;
    const p=seg(t,a,z); r.el.style.visibility=p>0?'visible':'hidden'; r.el.style.clipPath=`inset(-20px calc(${100-100*p}% + ${12*(1-p)}px) -20px -12px)`;});
  if(YB){
    const y=document.getElementById("yes"), yi=eout(seg(t,.25,.75)), yo=YB==="below"?1:1-eio(seg(t,AVA[0],AVA[0]+.45));
    y.style.opacity=yi*yo; y.style.transform=`translateY(${-40*(1-yi)}px)`;
    const w=eio(seg(t,STRIKE[1]+.05,STRIKE[1]+.42)); document.getElementById("but").style.clipPath=`inset(0 ${100-100*w}% 0 0)`;
  }
  const m=seg(t,AVA[1]+.45,AVA[1]+.8), mk=document.getElementById("mark");
  mk.style.opacity=m; mk.style.transform=`scale(${.6+.4*eout(m)})`;
}
window.setup=setup; window.render=render;
</script></body></html>
