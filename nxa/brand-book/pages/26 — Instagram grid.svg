<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>26 — Instagram grid</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#111111" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F4F4F2" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F4F4F2" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">24  ·  INSTAGRAM GRID</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">24 — INSTAGRAM GRID</tspan></text><text x="96" y="254.0" font-family="Syne" font-weight="800" font-style="normal" font-size="80" letter-spacing="-2" fill="#F4F4F2" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">A rhythm,</tspan><tspan x="96" dy="80.0">not a puzzle.</tspan></text><text x="96" y="459.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#F4F4F2" fill-opacity="0.85" text-anchor="start"><tspan x="96" dy="0.0">Every 3 posts:</tspan><tspan x="96" dy="36.0">1 · Before → after (the proof)</tspan><tspan x="96" dy="36.0">2 · Reel with Ava (the voice)</tspan><tspan x="96" dy="36.0">3 · Calm frame by Navid (the eye)</tspan><tspan x="96" dy="36.0"> </tspan><tspan x="96" dy="36.0">Rose appears in one tile per row, max.</tspan><tspan x="96" dy="36.0">No puzzle grids — each post stands alone.</tspan></text><rect x="1000" y="140" width="270" height="294" rx="0" fill="#C9CDD4" fill-opacity="1"/><text x="1016" y="411.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.8" te