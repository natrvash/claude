<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>11 — Construction</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#E6DCCD" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">09  ·  CONSTRUCTION — THE 35° LINE</tspan></text><text x="96" y="181.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">09 — CONSTRUCTION</tspan></text><text x="96" y="250.8" font-family="Syne" font-weight="700" font-style="normal" font-size="56" letter-spacing="-1" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Every stroke runs at 35°.</tspan></text><g transform="translate(260 380) scale(10.4790)"><path d="M0.000 0.000L0.000 30.215L3.422 30.215L3.422 4.135L40.880 30.215L44.302 30.215L44.302 0.000L40.880 0.000L40.880 26.079L3.422 0.000Z" fill="#111111"/><path d="M63.649 11.851L60.679 13.919L51.102 7.252L57.043 7.252ZM51.102 22.963L73.668 7.252L79.609 7.252L57.043 22.963ZM67.062 18.364L70.033 16.296L79.609 22.963L73.668 22.963Z" fill="#111111"/><path d="M89.831 4.134L127.289 30.215L133.230 30.215L89.831 0.000L86.409 0.000L86.409 26.793L86.409 30.215L89.831 30.215L116.485 30.215L111.621 26.793L89.831 26.793Z" fill="#111111"/></g><g transform="translate(260 380) scale(10.4790)"><g stroke="#D62271" stroke-width="0.16" fill="none"><line x1="-10" y1="-5.21" x2="55" y2="40.05"/><line x1="80" y1="-2.71" x2="145" y2="42.55"/><line x1="45" y1="27.21" x2="85" y2="-0.64"/></g><g stroke="#111111" stroke-opacity="0.35" stroke-width="0.08" stroke-dasharray="0.8 0.8" fill="none"><line x1="-18" y1="0" x2="152" y2="0"/><line x1="-18" y1="30.215" x2="152" y2="30.215"/><line x1="-18" y1="7.252" x2="152" y2="7.252"/><line x1="-18" y1="22.963" x2="152" y2="22.963"/></g></g><text x="96" y="857.6" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="72" letter-spacing="-1" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">35°</tspan></text><text x="96" y="904.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="96" dy="0.0">One angle for every diagonal — N, ×, A.</tspan><tspan x="96" dy="27.9">It is the brand’s signature line.</tspan></text><text x="696" y="857.6" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="72" letter-spacing="-1" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="696" dy="0.0">1 unit</tspan></text><text x="696" y="904.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="696" dy="0.0">Cap height of N and A.</tspan></text><text x="1296" y="857.6" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="72" letter-spacing="-1" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1296" dy="0.0">½ unit</tspan></text><text x="1296" y="904.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="1296" dy="0.0">Height of the ×. It sits on the optical</tspan><tspan x="1296" dy="27.9">centre, between the letters.</tspan></text></svg>