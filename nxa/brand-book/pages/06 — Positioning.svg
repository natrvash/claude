<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>06 — Positioning</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#C9CDD4" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">04  ·  POSITIONING</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">04 — POSITIONING</tspan></text><text x="96" y="266.8" font-family="Syne" font-weight="800" font-style="normal" font-size="96" letter-spacing="-2" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Where</tspan><tspan x="96" dy="96.0">we stand.</tspan></text><text x="96" y="439.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="0.85" text-anchor="start"><tspan x="96" dy="0.0">For independent restaurants, cafés, boutique</tspan><tspan x="96" dy="36.0">hotels and design brands in Dubai that want to</tspan><tspan x="96" dy="36.0">look world-class, NxA is the two-artist studio</tspan><tspan x="96" dy="36.0">that tailors space, food and story into one look —</tspan><tspan x="96" dy="36.0">at a price a small business can pay.</tspan><tspan x="96" dy="36.0"> </tspan><tspan x="96" dy="36.0">Unlike volume agencies, you always know who</tspan><tspan x="96" dy="36.0">is behind the camera.</tspan></text><text x="96" y="852.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Not Patek. Not Swatch. Omega.</tspan></text><rect x="1000" y="170" width="800" height="800" rx="4" fill="#F4F4F2" fill-opacity="1"/><rect x="1400.0" y="210" width="1" height="720" rx="0" fill="#111111" fill-opacity="0.25"/><rect x="1040" y="570.0" width="720" height="1" rx="0" fill="#111111" fill-opacity="0.25"/><text x="1750" y="595.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1750" dy="0.0">CRAFT-LED →</tspan></text><text x="1050" y="595.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="1050" dy="0.0">← VOLUME-LED</tspan></text><text x="1414.0" y="231.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="1414.0" dy="0.0">↑ NAMED ARTISTS</tspan></text><text x="1414.0" y="911.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="1414.0" dy="0.0">↓ FACELESS</tspan></text><circle cx="1170" cy="770" r="12" fill="#7D838D"/><text x="1196" y="770.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1196" dy="0.0">Big F&amp;B agencies</tspan></text><circle cx="1130" cy="350" r="12" fill="#7D838D"/><text x="1156" y="350.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1156" dy="0.0">DIY / freelancers</tspan></text><circle cx="1560" cy="670" r="12" fill="#7D838D"/><text x="1586" y="670.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1586" dy="0.0">Solo specialists</tspan></text><circle cx="1620" cy="350" r="22" fill="#D62271"/><text x="1656" y="355.6" font-family="Syne" font-weight="700" font-style="normal" font-size="32" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1656" dy="0.0">NxA</tspan></text></svg>