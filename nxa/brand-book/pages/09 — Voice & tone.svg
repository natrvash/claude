<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>09 — Voice &amp; tone</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F4F2" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">07  ·  VOICE &amp; TONE</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">07 — VOICE &amp; TONE</tspan></text><text x="96" y="266.8" font-family="Syne" font-weight="800" font-style="normal" font-size="96" letter-spacing="-2" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">How we</tspan><tspan x="96" dy="96.0">sound.</tspan></text><text x="96" y="439.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="0.85" text-anchor="start"><tspan x="96" dy="0.0">Ava speaks. Navid frames. We write like a friend with</tspan><tspan x="96" dy="36.0">impeccable taste: short lines, real process, no hype.</tspan></text><text x="96" y="619.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">We sound like a friend with taste</tspan></text><text x="856" y="624.4" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="28" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="end"><tspan x="856" dy="0.0">never a sales deck</tspan></text><rect x="96" y="656" width="760" height="1" rx="0" fill="#111111" fill-opacity="0.15"/><text x="96" y="695.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">We sound like confident — we show the work</tspan></text><text x="856" y="700.4" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="28" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="end"><tspan x="856" dy="0.0">never boastful</tspan></text><rect x="96" y="732" width="760" height="1" rx="0" fill="#111111" fill-opacity="0.15"/><text x="96" y="771.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">We sound like futuristic &amp; minimal</tspan></text><text x="856" y="776.4" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="28" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="end"><tspan x="856" dy="0.0">never cold</tspan></text><rect x="96" y="808" width="760" height="1" rx="0" fill="#111111" fill-opacity="0.15"/><text x="96" y="847.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">We sound like playful in the studio</tspan></text><text x="856" y="852.4" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="28" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="end"><tspan x="856" dy="0.0">never careless with clients</tspan></text><rect x="96" y="884" width="760" height="1" rx="0" fill="#111111" fill-opacity="0.15"/><text x="1000" y="181.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1000" dy="0.0">WORDS WE USE</tspan></text><text x="1000" y="230.0" font-family="Syne" font-weight="700" font-style="normal" font-size="30" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1000" dy="0.0">tailored · frame · light · texture · table ·</tspan><tspan x="1000" dy="36.0">space · story · hand-made · the suit</tspan></text><text x="1000" y="341.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1000" dy="0.0">WORDS WE BAN</tspan></text><text x="1000" y="385.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="0.6" text-anchor="start"><tspan x="1000" dy="0.0">elevate · next level · game-changer · unlock ·</tspan><tspan x="1000" dy="36.0">premium quality content · in today’s fast-paced</tspan><tspan x="1000" dy="36.0">world · fake urgency</tspan></text><text x="1000" y="531.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1000" dy="0.0">SAMPLE CAPTION</tspan></text><rect x="1000" y="556" width="824" height="230" rx="0" fill="#C9CDD4" fill-opacity="1"/><text x="1032" y="607.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1032" dy="0.0">Same café. Same table. Same coffee.</tspan><tspan x="1032" dy="36.0">We just changed the light, the angle and the story.</tspan><tspan x="1032" dy="36.0">This is what a suit looks like on a small business. ×</tspan></text><text x="1032" y="744.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.6" text-anchor="start"><tspan x="1032" dy="0.0">Emoji: one, max. Hashtags: 3–5 topic tags, never a block.</tspan></text></svg>