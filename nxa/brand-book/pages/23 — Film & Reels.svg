<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>23 — Film &amp; Reels</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#111111" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F4F4F2" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F4F4F2" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">21  ·  FILM &amp; REELS</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">21 — FILM &amp; REELS</tspan></text><text x="96" y="266.8" font-family="Syne" font-weight="800" font-style="normal" font-size="96" letter-spacing="-2" fill="#F4F4F2" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">She talks.</tspan><tspan x="96" dy="96.0">He frames.</tspan></text><text x="980" y="192.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="980" dy="0.0">0–3 s</tspan></text><text x="980" y="228.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#F4F4F2" fill-opacity="0.8" text-anchor="start"><tspan x="980" dy="0.0">Open on the result — the finished plate, the lit room.</tspan><tspan x="980" dy="27.9">The words on screen match the words spoken.</tspan></text><text x="980" y="332.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="980" dy="0.0">Ava</tspan></text><text x="980" y="368.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#F4F4F2" fill-opacity="0.8" text-anchor="start"><tspan x="980" dy="0.0">On camera, talking to one person.</tspan><tspan x="980" dy="27.9">Warm, quick, real. Never read off a phone.</tspan></text><text x="980" y="472.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="980" dy="0.0">Navid</tspan></text><text x="980" y="508.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#F4F4F2" fill-opacity="0.8" text-anchor="start"><tspan x="980" dy="0.0">Behind the camera. Seen through hands,</tspan><tspan x="980" dy="27.9">process and the final frame.</tspan></text><text x="980" y="612.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="980" dy="0.0">Captions</tspan></text><text x="980" y="648.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#F4F4F2" fill-opacity="0.8" text-anchor="start"><tspan x="980" dy="0.0">Always burned in: Manrope Bold, Porcelain on Ink</tspan><tspan x="980" dy="27.9">at 70%, lower third, max 2 lines.</tspan></text><text x="980" y="752.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="980" dy="0.0">The × wipe</tspan></text><text x="980" y="788.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#F4F4F2" fill-opacity="0.8" text-anchor="start"><tspan x="980" dy="0.0">Our signature transition: a 35° diagonal</tspan><tspan x="980" dy="27.9">wipe from before to after.</tspan></text><text x="980" y="892.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="980" dy="0.0">End card</tspan></text><text x="980" y="928.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#F4F4F2" fill-opacity="0.8" text-anchor="start"><tspan x="980" dy="0.0">The × on Ink, 1 second, no music sting.</tspan></text><rect x="96" y="470" width="320" height="570" rx="24" fill="#7D838D" fill-opacity="1"/><text x="120" y="1001.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F4F4F2" fill-opacity="0.7" text-anchor="start"><tspan x="120" dy="0.0">9:16 REEL FRAME</tspan></text><rect x="116" y="880" width="280" height="70" rx="8" fill="#111111" fill-opacity="0.7"/><text x="132" y="910.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#F4F4F2" fill-opacity="1" text-anchor="start"><tspan x="132" dy="0.0">Same place. New scene.</tspan></text></svg>