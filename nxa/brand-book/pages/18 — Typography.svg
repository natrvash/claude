<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>18 — Typography</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F4F2" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">16  ·  TYPOGRAPHY</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">16 — TYPOGRAPHY</tspan></text><text x="96" y="254.0" font-family="Syne" font-weight="800" font-style="normal" font-size="80" letter-spacing="-2" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Shout, whisper, speak.</tspan></text><text x="96" y="460.0" font-family="Syne" font-weight="800" font-style="normal" font-size="200" letter-spacing="-2" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Aa</tspan></text><text x="96" y="565.6" font-family="Syne" font-weight="700" font-style="normal" font-size="32" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Syne ExtraBold</tspan></text><text x="96" y="601.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">DISPLAY — THE SHOUT</tspan></text><text x="96" y="644.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.75" text-anchor="start"><tspan x="96" dy="0.0">Futuristic, artful, wide.</tspan><tspan x="96" dy="27.9">Short headlines only.</tspan></text><text x="696" y="460.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="200" letter-spacing="-1" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="696" dy="0.0">Aa</tspan></text><text x="696" y="565.6" font-family="Syne" font-weight="700" font-style="normal" font-size="32" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="696" dy="0.0">Instrument Serif Italic</tspan></text><text x="696" y="601.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="696" dy="0.0">ACCENT — THE WHISPER</tspan></text><text x="696" y="644.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.75" text-anchor="start"><tspan x="696" dy="0.0">The suit. One line per layout,</tspan><tspan x="696" dy="27.9">next to the shout.</tspan></text><text x="1296" y="460.0" font-family="Manrope" font-weight="400" font-style="normal" font-size="200" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1296" dy="0.0">Aa</tspan></text><text x="1296" y="565.6" font-family="Syne" font-weight="700" font-style="normal" font-size="32" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1296" dy="0.0">Manrope</tspan></text><text x="1296" y="601.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1296" dy="0.0">BODY — THE SPEAKING VOICE</tspan></text><text x="1296" y="644.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.75" text-anchor="start"><tspan x="1296" dy="0.0">Clean and legible. Regular</tspan><tspan x="1296" dy="27.9">for reading, Bold for labels.</tspan></text><rect x="96" y="740" width="1728" height="1" rx="0" fill="#111111" fill-opacity="0.2"/><text x="96" y="850.4" font-family="Syne" font-weight="800" font-style="normal" font-size="88" letter-spacing="-2" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">From t-shirt</tspan></text><text x="96" y="950.4" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="88" letter-spacing="-1" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">to suit.</tspan></text><text x="1100" y="804.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.75" text-anchor="start"><tspan x="1100" dy="0.0">Display 96–160 · H1 56 · H2 32</tspan><tspan x="1100" dy="27.9">Serif accent 40–72 · Body 18–24</tspan><tspan x="1100" dy="27.9">Labels 14 caps, +18% tracking</tspan><tspan x="1100" dy="27.9">All free Google Fonts.</tspan></text></svg>