<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>22 — Photography</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F4F2" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">20  ·  PHOTOGRAPHY</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">20 — PHOTOGRAPHY</tspan></text><text x="96" y="266.8" font-family="Syne" font-weight="800" font-style="normal" font-size="96" letter-spacing="-2" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Two eyes, one frame.</tspan></text><rect x="96" y="340" width="410" height="470" rx="0" fill="#C9CDD4" fill-opacity="1"/><text x="116" y="781.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.6" text-anchor="start"><tspan x="116" dy="0.0">SPACE</tspan></text><text x="96" y="844.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="96" dy="0.0">Symmetry, one strong line, natural light</tspan></text><rect x="536" y="340" width="410" height="470" rx="0" fill="#F4D6E2" fill-opacity="1"/><text x="556" y="781.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.6" text-anchor="start"><tspan x="556" dy="0.0">HANDS</tspan></text><text x="536" y="844.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="536" dy="0.0">The making, not just the made</tspan></text><rect x="976" y="340" width="410" height="470" rx="0" fill="#C9CDD4" fill-opacity="1"/><text x="996" y="781.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.6" text-anchor="start"><tspan x="996" dy="0.0">TABLE</tspan></text><text x="976" y="844.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="976" dy="0.0">Steam, texture, a real bite taken</tspan></text><rect x="1416" y="340" width="410" height="470" rx="0" fill="#F4D6E2" fill-opacity="1"/><text x="1436" y="781.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.6" text-anchor="start"><tspan x="1436" dy="0.0">PEOPLE</tspan></text><text x="1416" y="844.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="1416" dy="0.0">Staff and owners, candid, never stock</tspan></text><text x="96" y="914.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.85" text-anchor="start"><tspan x="96" dy="0.0">Navid’s frame: light first, lines at 35°, calm symmetry, space to breathe.   Ava’s frame: life, hands, food in motion, warmth.</tspan></text><text x="96" y="954.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.85" text-anchor="start"><tspan x="96" dy="0.0">Grade: true colour, warm neutrals, soft Ink shadows. No heavy filters, no fake HDR, no AI-generated images — ever.</tspan></text></svg>