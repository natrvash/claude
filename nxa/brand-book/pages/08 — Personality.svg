<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>08 — Personality</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#111111" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">06  ·  PERSONALITY</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">06 — PERSONALITY</tspan></text><text x="96" y="266.8" font-family="Syne" font-weight="800" font-style="normal" font-size="96" letter-spacing="-2" fill="#F6F2EC" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Calm ×</tspan><tspan x="96" dy="96.0">energetic.</tspan></text><text x="96" y="439.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#F6F2EC" fill-opacity="0.85" text-anchor="start"><tspan x="96" dy="0.0">Navid is the calm. Ava is the energy. NxA lives</tspan><tspan x="96" dy="36.0">in the tension between them: futuristic and</tspan><tspan x="96" dy="36.0">minimal on the surface, warm and playful</tspan><tspan x="96" dy="36.0">underneath. Serious in the meeting, playful</tspan><tspan x="96" dy="36.0">in the studio.</tspan></text><text x="96" y="731.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">IF NXA WERE…</tspan></text><text x="96" y="792.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#F6F2EC" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">a painter — David Hockney</tspan><tspan x="96" dy="46.0">a couple — David &amp; Victoria Beckham</tspan><tspan x="96" dy="46.0">a voice — Adele</tspan></text><text x="1000" y="241.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="start"><tspan x="1000" dy="0.0">LUXURY</tspan></text><text x="1820" y="241.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="end"><tspan x="1820" dy="0.0">AFFORDABLE</tspan></text><rect x="1000" y="274" width="820" height="2" rx="0" fill="#F6F2EC" fill-opacity="0.25"/><circle cx="1410.0" cy="275" r="14" fill="#D62271"/><text x="1000" y="371.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="start"><tspan x="1000" dy="0.0">SERIOUS</tspan></text><text x="1820" y="371.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="end"><tspan x="1820" dy="0.0">PLAYFUL</tspan></text><rect x="1000" y="404" width="820" height="2" rx="0" fill="#F6F2EC" fill-opacity="0.25"/><circle cx="1410.0" cy="405" r="14" fill="#D62271"/><text x="1000" y="501.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="start"><tspan x="1000" dy="0.0">MINIMAL</tspan></text><text x="1820" y="501.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="end"><tspan x="1820" dy="0.0">BOLD</tspan></text><rect x="1000" y="534" width="820" height="2" rx="0" fill="#F6F2EC" fill-opacity="0.25"/><circle cx="1246.0" cy="535" r="14" fill="#D62271"/><text x="1000" y="631.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="start"><tspan x="1000" dy="0.0">EXPERT</tspan></text><text x="1820" y="631.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="end"><tspan x="1820" dy="0.0">FRIEND</tspan></text><rect x="1000" y="664" width="820" height="2" rx="0" fill="#F6F2EC" fill-opacity="0.25"/><circle cx="1656.0" cy="665" r="14" fill="#D62271"/><text x="1000" y="761.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="start"><tspan x="1000" dy="0.0">TRADITIONAL</tspan></text><text x="1820" y="761.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="end"><tspan x="1820" dy="0.0">FUTURISTIC</tspan></text><rect x="1000" y="794" width="820" height="2" rx="0" fill="#F6F2EC" fill-opacity="0.25"/><circle cx="1779.0" cy="795" r="14" fill="#D62271"/><text x="1000" y="891.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="start"><tspan x="1000" dy="0.0">CALM</tspan></text><text x="1820" y="891.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.7" text-anchor="end"><tspan x="1820" dy="0.0">ENERGETIC</tspan></text><rect x="1000" y="924" width="820" height="2" rx="0" fill="#F6F2EC" fill-opacity="0.25"/><circle cx="1410.0" cy="925" r="14" fill="#D62271"/></svg>