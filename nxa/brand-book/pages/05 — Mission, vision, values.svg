<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>05 — Mission, vision, values</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F4F2" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">03  ·  MISSION, VISION, VALUES</tspan></text><text x="96" y="191.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">MISSION</tspan></text><text x="96" y="264.8" font-family="Syne" font-weight="700" font-style="normal" font-size="56" letter-spacing="-1" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Make Dubai’s independent</tspan><tspan x="96" dy="61.6">places look as good as</tspan><tspan x="96" dy="61.6">they really are.</tspan></text><text x="1000" y="191.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1000" dy="0.0">VISION</tspan></text><text x="1000" y="264.8" font-family="Syne" font-weight="700" font-style="normal" font-size="56" letter-spacing="-1" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1000" dy="0.0">The studio Dubai’s best small</tspan><tspan x="1000" dy="61.6">brands name when someone</tspan><tspan x="1000" dy="61.6">asks: “who shot this?”</tspan></text><rect x="96" y="520" width="1728" height="1" rx="0" fill="#111111" fill-opacity="0.2"/><text x="96" y="581.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">VALUES</tspan></text><text x="96" y="662.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">01</tspan></text><text x="96" y="712.4" font-family="Syne" font-weight="700" font-style="normal" font-size="28" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Made by hand</tspan></text><text x="96" y="754.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.75" text-anchor="start"><tspan x="96" dy="0.0">Real people, real cameras, real</tspan><tspan x="96" dy="27.9">light. No AI faces, no AI voices.</tspan></text><text x="540" y="662.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="540" dy="0.0">02</tspan></text><text x="540" y="712.4" font-family="Syne" font-weight="700" font-style="normal" font-size="28" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="540" dy="0.0">Tailored, not templated</tspan></text><text x="540" y="754.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.75" text-anchor="start"><tspan x="540" dy="0.0">Every client gets their own cut.</tspan><tspan x="540" dy="27.9">No copy-paste looks.</tspan></text><text x="984" y="662.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="984" dy="0.0">03</tspan></text><text x="984" y="712.4" font-family="Syne" font-weight="700" font-style="normal" font-size="28" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="984" dy="0.0">Affordable luxury</tspan></text><text x="984" y="754.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.75" text-anchor="start"><tspan x="984" dy="0.0">Omega — not Patek Philippe, not</tspan><tspan x="984" dy="27.9">Swatch. Premium a small business</tspan><tspan x="984" dy="27.9">can own.</tspan></text><text x="1428" y="662.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1428" dy="0.0">04</tspan></text><text x="1428" y="712.4" font-family="Syne" font-weight="700" font-style="normal" font-size="28" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1428" dy="0.0">Two eyes, one frame</tspan></text><text x="1428" y="754.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.75" text-anchor="start"><tspan x="1428" dy="0.0">Space and story, always shot</tspan><tspan x="1428" dy="27.9">together. Navid’s frame, Ava’s</tspan><tspan x="1428" dy="27.9">feeling.</tspan></text></svg>