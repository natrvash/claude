<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>18 — Type system</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F6F2EC" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">16  ·  TYPE SYSTEM</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">16 — TYPE SYSTEM</tspan></text><text x="96" y="254.0" font-family="Syne" font-weight="800" font-style="normal" font-size="80" letter-spacing="-2" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Rules and alternatives.</tspan></text><text x="96" y="341.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">RULES</tspan></text><text x="96" y="389.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="0.85" text-anchor="start"><tspan x="96" dy="0.0">Headlines: sentence case, max 6 words, Syne.</tspan><tspan x="96" dy="36.0">One serif italic line per layout — never two.</tspan><tspan x="96" dy="36.0">Body: Manrope Regular, 45–75 characters a line.</tspan><tspan x="96" dy="36.0">Labels: Manrope Bold caps, wide tracking.</tspan><tspan x="96" dy="36.0">On Instagram (1080 px): headline 72–96,</tspan><tspan x="96" dy="36.0">body 32–40, never below 28.</tspan><tspan x="96" dy="36.0">Never stretch, outline or shadow type.</tspan></text><text x="96" y="791.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">ARABIC &amp; PERSIAN COMPANIONS</tspan></text><text x="96" y="855.2" font-family="IBM Plex Sans Arabic" font-weight="700" font-style="normal" font-size="44" letter-spacing="-1" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">من التيشيرت إلى البدلة</tspan></text><text x="96" y="935.2" font-family="Vazirmatn" font-weight="700" font-style="normal" font-size="44" letter-spacing="-1" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">از تی‌شرت تا کت‌وشلوار</tspan></text><text x="96" y="994.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.7" text-anchor="start"><tspan x="96" dy="0.0">IBM Plex Sans Arabic · Vazirmatn — for bilingual posts and Persian food stories.</tspan></text><rect x="1000" y="330" width="824" height="200" rx="4" fill="#E6DCCD" fill-opacity="1"/><text x="1030" y="365.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1030" dy="0.0">MORE CLASSIC</tspan></text><text x="1030" y="428.4" font-family="Fraunces" font-weight="600" font-style="normal" font-size="48" letter-spacing="-1" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1030" dy="0.0">From t-shirt to suit.</tspan></text><text x="1030" y="484.4" font-family="Inter" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="1030" dy="0.0">Fraunces + Inter — Warmer, bookish. For hotels and fine dining.</tspan></text><rect x="1000" y="560" width="824" height="200" rx="4" fill="#F4D6E2" fill-opacity="1"/><text x="1030" y="595.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1030" dy="0.0">MORE EDITORIAL</tspan></text><text x="1030" y="658.4" font-family="Playfair Display" font-weight="400" font-style="italic" font-size="48" letter-spacing="-1" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1030" dy="0.0">From t-shirt to suit.</tspan></text><text x="1030" y="714.4" font-family="Space Grotesk" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="1030" dy="0.0">Playfair Display + Space Grotesk — Magazine feel. For fashion and styling.</tspan></text><rect x="1000" y="790" width="824" height="200" rx="4" fill="#E6DCCD" fill-opacity="1"/><text x="1030" y="825.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1030" dy="0.0">MORE FUTURISTIC</tspan></text><text x="1030" y="888.4" font-family="Unbounded" font-weight="700" font-style="normal" font-size="48" letter-spacing="-1" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1030" dy="0.0">From t-shirt to suit.</tspan></text><text x="1030" y="944.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="1030" dy="0.0">Unbounded + Manrope — Louder, techier. For launches and events.</tspan></text></svg>