<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>03 — Our story</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F4F2" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">01  ·  OUR STORY</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">01 — OUR STORY</tspan></text><text x="96" y="254.0" font-family="Syne" font-weight="800" font-style="normal" font-size="80" letter-spacing="-2" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Navid × Ava.</tspan></text><text x="96" y="342.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Partners in life. Partners in frame.</tspan></text><text x="96" y="409.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="0.85" text-anchor="start"><tspan x="96" dy="0.0">NxA is a creative studio in Dubai run by two artists.</tspan><tspan x="96" dy="36.0">Navid is a photographer and art director who sees</tspan><tspan x="96" dy="36.0">in light, lines and space. Ava is a filmmaker,</tspan><tspan x="96" dy="36.0">storyteller, cook and stylist who sees in people,</tspan><tspan x="96" dy="36.0">flavour and feeling.</tspan><tspan x="96" dy="36.0"> </tspan><tspan x="96" dy="36.0">Together we make places, products and brands look</tspan><tspan x="96" dy="36.0">the way they deserve to look — on camera, by hand,</tspan><tspan x="96" dy="36.0">with no shortcuts.</tspan></text><rect x="980" y="180" width="400" height="560" rx="0" fill="#C9CDD4" fill-opacity="1"/><rect x="1424" y="180" width="400" height="560" rx="0" fill="#F4D6E2" fill-opacity="1"/><text x="1004" y="701.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.5" text-anchor="start"><tspan x="1004" dy="0.0">PORTRAIT — NAVID</tspan><tspan x="1004" dy="18.2">(BEHIND THE CAMERA)</tspan></text><text x="1448" y="701.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.5" text-anchor="start"><tspan x="1448" dy="0.0">PORTRAIT — AVA</tspan><tspan x="1448" dy="18.2">(IN FRONT OF IT)</tspan></text><g transform="translate(1354 432) scale(3.3676) translate(-51.102 -7.252)" fill-opacity="1"><path d="M63.649 11.851L60.679 13.919L51.102 7.252L57.043 7.252ZM51.102 22.963L73.668 7.252L79.609 7.252L57.043 22.963ZM67.062 18.364L70.033 16.296L79.609 22.963L73.668 22.963Z" fill="#D62271"/></g><text x="980" y="805.6" font-family="Syne" font-weight="700" font-style="normal" font-size="32" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="980" dy="0.0">Navid — the eye</tspan></text><text x="980" y="844.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.75" text-anchor="start"><tspan x="980" dy="0.0">Photographer &amp; art director. Space,</tspan><tspan x="980" dy="27.9">architecture, light. Calm, precise,</tspan><tspan x="980" dy="27.9">behind the camera.</tspan></text><text x="1424" y="805.6" font-family="Syne" font-weight="700" font-style="normal" font-size="32" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1424" dy="0.0">Ava — the voice</tspan></text><text x="1424" y="844.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.75" text-anchor="start"><tspan x="1424" dy="0.0">Filmmaker, storyteller, cook &amp; stylist.</tspan><tspan x="1424" dy="27.9">Food, people, story. Energetic, warm,</tspan><tspan x="1424" dy="27.9">in front of the camera.</tspan></text></svg>