ont-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.7" text-anchor="start"><tspan x="536" dy="0.0">CAROUSEL COVER</tspan><tspan x="536" dy="18.2">1080×1350</tspan></text><text x="976" y="731.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.7" text-anchor="start"><tspan x="976" dy="0.0">QUOTE / POINT OF VIEW</tspan><tspan x="976" dy="18.2">1080×1350</tspan></text><text x="1416" y="731.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.7" text-anchor="start"><tspan x="1416" dy="0.0">REEL COVER</tspan><tspan x="1416" dy="18.2">1080×1920 (SAFE 4:5)</tspan></text><text x="96" y="874.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="96" dy="0.0">Rules: one message per post · the × sign-off only, never the full logo on content · one Rose element per post.</tspan></text></svg>