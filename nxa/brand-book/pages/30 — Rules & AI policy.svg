<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>30 — Rules &amp; AI policy</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F4F2" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">28  ·  RULES &amp; AI POLICY</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">28 — RULES &amp; AI POLICY</tspan></text><text x="96" y="266.8" font-family="Syne" font-weight="800" font-style="normal" font-size="96" letter-spacing="-2" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Real hands.</tspan><tspan x="96" dy="96.0">Real cameras.</tspan></text><text x="96" y="471.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">ALWAYS</tspan></text><text x="96" y="519.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="0.85" text-anchor="start"><tspan x="96" dy="0.0">Show the process — hands, set-ups, light</tspan><tspan x="96" dy="36.0">Name the people behind every shoot</tspan><tspan x="96" dy="36.0">Get client approval before posting their work</tspan><tspan x="96" dy="36.0">Burn captions into every video</tspan><tspan x="96" dy="36.0">Write alt text for every image</tspan><tspan x="96" dy="36.0">Respect UAE content rules and guests’ privacy</tspan></text><text x="1000" y="471.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1000" dy="0.0">NEVER</tspan></text><text x="1000" y="519.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#111111" fill-opacity="0.85" text-anchor="start"><tspan x="1000" dy="0.0">No AI faces, AI voices or cloned voices</tspan><tspan x="1000" dy="36.0">No AI-generated food, spaces or people as our work</tspan><tspan x="1000" dy="36.0">No fake numbers, fake urgency or fake reviews</tspan><tspan x="1000" dy="36.0">No naming or mocking other agencies</tspan><tspan x="1000" dy="36.0">No posting client work before they publish</tspan><tspan x="1000" dy="36.0">No stock photos — ever</tspan></text><rect x="96" y="860" width="1728" height="1" rx="0" fill="#111111" fill-opacity="0.2"/><text x="96" y="925.6" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="32" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">AI may help us plan, draft captions and edit. It never replaces the camera. Every portfolio image is a real shoot.</tspan></text></svg>