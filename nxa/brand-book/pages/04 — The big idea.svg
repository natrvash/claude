<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>04 — The big idea</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#111111" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#F6F2EC" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">02  ·  THE BIG IDEA</tspan></text><text x="96" y="211.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">02 — THE BIG IDEA</tspan></text><text x="96" y="388.0" font-family="Syne" font-weight="800" font-style="normal" font-size="160" letter-spacing="-2" fill="#F6F2EC" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">From t-shirt</tspan></text><text x="96" y="550.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="150" letter-spacing="-1" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">to suit.</tspan></text><text x="96" y="699.2" font-family="Manrope" font-weight="400" font-style="normal" font-size="24" letter-spacing="0" fill="#F6F2EC" fill-opacity="0.85" text-anchor="start"><tspan x="96" dy="0.0">Most small businesses show up online in a t-shirt and a hoodie. The big brands hire agencies a small</tspan><tspan x="96" dy="36.0">business can’t afford. NxA puts every client in a well-cut suit: tailored content, made by hand and</tspan><tspan x="96" dy="36.0">camera, at a price a small business can pay.</tspan></text><text x="96" y="862.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#F6F2EC" fill-opacity="0.6" text-anchor="start"><tspan x="96" dy="0.0">Everything in this book serves that one idea.</tspan></text></svg>