<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>07 — Audience</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F4F2" fill-opacity="1"/><text x="96" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">NXA — BRAND IDENTITY BOOK</tspan></text><text x="1824" y="75.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="end"><tspan x="1824" dy="0.0">05  ·  AUDIENCE</tspan></text><text x="96" y="161.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">05 — AUDIENCE</tspan></text><text x="96" y="266.8" font-family="Syne" font-weight="800" font-style="normal" font-size="96" letter-spacing="-2" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Who we dress.</tspan></text><rect x="96" y="360" width="820" height="480" rx="4" fill="#C9CDD4" fill-opacity="1"/><text x="136" y="411.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="136" dy="0.0">LEAD SEGMENT · MONTHS 1–3</tspan></text><text x="136" y="461.6" font-family="Syne" font-weight="700" font-style="normal" font-size="32" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="136" dy="0.0">Hospitality owners</tspan></text><text x="136" y="514.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="136" dy="0.0">Independent restaurants, cafés, boutique hotels and</tspan><tspan x="136" dy="27.9">concept stores in Dubai, under 50 staff.</tspan><tspan x="136" dy="27.9"> </tspan><tspan x="136" dy="27.9">They want to look as good as the big names and win</tspan><tspan x="136" dy="27.9">bookings — without a big-agency bill.</tspan><tspan x="136" dy="27.9"> </tspan><tspan x="136" dy="27.9">They decide fast, by look and by trust. Instagram first.</tspan><tspan x="136" dy="27.9"> </tspan><tspan x="136" dy="27.9">Before → after: t-shirt content → a tailored look that</tspan><tspan x="136" dy="27.9">matches the real quality of the place.</tspan></text><rect x="1004" y="360" width="820" height="480" rx="4" fill="#F4D6E2" fill-opacity="1"/><text x="1044" y="411.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#D62271" fill-opacity="1" text-anchor="start"><tspan x="1044" dy="0.0">SECONDARY SEGMENT</tspan></text><text x="1044" y="461.6" font-family="Syne" font-weight="700" font-style="normal" font-size="32" letter-spacing="-0.5" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="1044" dy="0.0">Design &amp; lifestyle brands</tspan></text><text x="1044" y="514.4" font-family="Manrope" font-weight="400" font-style="normal" font-size="18" letter-spacing="0" fill="#111111" fill-opacity="0.8" text-anchor="start"><tspan x="1044" dy="0.0">Interior studios, furniture and design brands, developer</tspan><tspan x="1044" dy="27.9">show units, fashion and lifestyle labels.</tspan><tspan x="1044" dy="27.9"> </tspan><tspan x="1044" dy="27.9">They care about space, material and craft — Navid’s</tspan><tspan x="1044" dy="27.9">home ground.</tspan><tspan x="1044" dy="27.9"> </tspan><tspan x="1044" dy="27.9">Followers include creatives; buyers are owners.</tspan><tspan x="1044" dy="27.9">Impress the first, convert the second.</tspan></text><text x="96" y="891.2" font-family="Manrope" font-weight="700" font-style="normal" font-size="14" letter-spacing="2.5" fill="#111111" fill-opacity="0.55" text-anchor="start"><tspan x="96" dy="0.0">THE BAR WE AIM FOR (NOT THE PRICE LIST)</tspan></text><text x="96" y="952.0" font-family="Instrument Serif" font-weight="400" font-style="italic" font-size="40" letter-spacing="0" fill="#111111" fill-opacity="1" text-anchor="start"><tspan x="96" dy="0.0">Atlantis The Royal  ·  Ariana’s Persian Kitchen  ·  Studio Nada Debs  ·  Omniyat  ·  The Lana</tspan></text></svg>