<!--
  ============================================================
  NAVID ATRVASH - BEFORE / AFTER SLIDER
  Paste everything below into ONE Squarespace Code Block.
  Self-contained: nothing else needed, no URLs to replace.

  To ADD a pair:
    1. copy one whole <div class="na-slide"> block and paste
       it after the last one, then change the two image URLs
       (the first <img> is the BEFORE, the one inside
       na-ba-after is the AFTER);
    2. copy one <button> inside <div class="na-strip"> and
       give it the next data-go number;
    3. add a matching {t:"Title",n:"Note"} entry at the end
       of the META list in the script.
  Both frames of a pair must share the same crop and aspect
  ratio, or the slider will jump between them.
  ============================================================
-->

.na-ba-wrap .na-view{position:relative;width:100%;overflow:hidden;background:#f2f2f3}
.na-ba-wrap .na-track{display:flex;width:100%;transition:transform .55s cubic-bezier(.22,.7,.2,1)}

.na-ba-wrap .na-ba{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;background:#f2f2f3;

.na-ba-wrap .na-ba:focus-visible{outline:2px solid var(--na-mag)}

  user-select:none;-webkit-user-drag:none;margin:0;max-width:none}
.na-ba-wrap .na-ba-after{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}
.na-ba-wrap .na-ba-line{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--na-mag);
  transform:translateX(-1px);pointer-events:none}
.na-ba-wrap .na-ba-grip{position:absolute;top:50%;left:50%;width:48px;height:48px;margin:-24px 0 0 -24px;

  border-top:5px solid transparent;border-bottom:5px solid transparent}
.na-ba-wrap .na-ba-grip s{border-right:6px solid var(--na-mag)}
.na-ba-wrap .na-ba-grip b{border-left:6px solid var(--na-mag)}
.na-ba-wrap .na-tagl,.na-ba-wrap .na-tagr{position:absolute;top:16px;font-size:11px;letter-spacing:.28em;

.na-ba-wrap .na-strip{display:flex;flex-wrap:wrap;gap:8px}
.na-ba-wrap .na-strip button{border:1px solid #656263;background:none;padding:0;width:96px;height:64px;

.na-ba-wrap .na-strip button.is-on{opacity:1;border-color:var(--na-mag)}
.na-ba-wrap .na-strip img{width:100%;height:100%;object-fit:cover;display:block;margin:0}

@media (max-width:640px){

</style>

<script>
(function () {
  var root = document.querySelector('.na-ba-wrap');
  if (!root) return;
  var META = [
    { t: "Terrace at dusk", n: "Sky, glass, ambient light" },
    { t: "Kitchen island and waterfront", n: "Light shaping, glass" },
    { t: "Terrace lounge", n: "Colour, contrast" },
    { t: "Corridor and wine wall", n: "Exposure blend, stone" },
    { t: "Living room", n: "Tone, reflections" },
    { t: "Residence living room", n: "Colour, clean-up" },
    { t: "Bedroom", n: "Clean-up, tone" },
    { t: "Hotel room", n: "Window light, warmth" }
  ];
  var track = root.querySelector('.na-track');
  var slides = root.querySelectorAll('.na-slide');
  var thumbs = root.querySelectorAll('.na-strip button');
  var elNum = root.querySelector('[data-num]');
  var elTitle = root.querySelector('[data-title]');
  var elNote = root.querySelector('[data-note]');
  var elCount = root.querySelector('[data-count]');
  var active = 0;

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function show(i) {
    active = (i + slides.length) % slides.length;
    track.style.transform = 'translateX(-' + (active * 100) + '%)';
    for (var k = 0; k < thumbs.length; k++) {
      thumbs[k].className = (k === active) ? 'is-on' : '';
    }
    elNum.textContent = pad(active + 1);
    elTitle.textContent = META[active].t;
    elNote.textContent = META[active].n;
    elCount.textContent = pad(active + 1) + ' / ' + pad(slides.length);
  }

  root.querySelector('[data-prev]').addEventListener('click', function () { show(active - 1); });
  root.querySelector('[data-next]').addEventListener('click', function () { show(active + 1); });
  for (var t = 0; t < thumbs.length; t++) {
    thumbs[t].addEventListener('click', function () {
      show(parseInt(this.getAttribute('data-go'), 10));
    });
  }

  var stages = root.querySelectorAll('.na-ba');
  for (var i = 0; i < stages.length; i++) wire(stages[i]);

  function wire(stage) {
    var after = stage.querySelector('.na-ba-after');
    var line = stage.querySelector('.na-ba-line');
    var grip = stage.querySelector('.na-ba-grip');
    var dragging = false;

    function set(pct) {
      pct = Math.max(0, Math.min(100, pct));
      after.style.clipPath = 'inset(0 ' + (100 - pct).toFixed(2) + '% 0 0)';
      line.style.left = pct.toFixed(2) + '%';
      grip.style.left = pct.toFixed(2) + '%';
      stage.setAttribute('aria-valuenow', Math.round(pct));
    }
    function fromEvent(e) {
      var r = stage.getBoundingClientRect();
      set(((e.clientX - r.left) / r.width) * 100);
    }
    stage.addEventListener('pointerdown', function (e) {
      dragging = true;
      fromEvent(e);
      try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    });
    stage.addEventListener('pointermove', function (e) { if (dragging) fromEvent(e); });
    stage.addEventListener('pointerup', function () { dragging = false; });
    stage.addEventListener('pointercancel', function () { dragging = false; });
    stage.addEventListener('keydown', function (e) {
      var now = parseFloat(stage.getAttribute('aria-valuenow')) || 50;
      if (e.key === 'ArrowLeft') { e.preventDefault(); set(now - 4); }
      if (e.key === 'ArrowRight') { e.preventDefault(); set(now + 4); }
    });
    set(50);
  }

  show(0);
})();
</script>
